<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini AI Chatbot</title>

<style>

  *{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg,#0f172a,#1e293b);
  height:100vh;
  overflow:hidden;
  color:white;
}

.app{
  display:flex;
  height:100vh;
}

/* SIDEBAR */

.sidebar{
  width:280px;
  background:rgba(255,255,255,0.05);
  backdrop-filter: blur(15px);
  border-right:1px solid rgba(255,255,255,0.1);
  padding:20px;
  overflow-y:auto;
}

.sidebar h3{
  margin-bottom:20px;
  font-size:22px;
}

.history-item{
  background:rgba(255,255,255,0.08);
  padding:14px;
  margin-bottom:12px;
  border-radius:14px;
  cursor:pointer;
  transition:0.3s;
  border:1px solid transparent;
}

.history-item:hover{
  background:rgba(255,255,255,0.12);
  transform:translateY(-2px);
  border:1px solid #38bdf8;
}

/* MAIN */

.container{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.header{
  padding:22px;
  font-size:24px;
  font-weight:700;
  background:rgba(255,255,255,0.05);
  backdrop-filter: blur(15px);
  border-bottom:1px solid rgba(255,255,255,0.08);
  display:flex;
  align-items:center;
  gap:10px;
}

.header::before{
  content:'🤖';
  font-size:28px;
}

#chat-box{
  flex:1;
  overflow-y:auto;
  padding:30px;
  display:flex;
  flex-direction:column;
  gap:20px;
}

/* MESSAGE */

.message{
  display:flex;
  animation:fadeIn 0.3s ease;
}

.user{
  justify-content:flex-end;
}

.bot{
  justify-content:flex-start;
}

.bubble{
  padding:15px 18px;
  border-radius:18px;
  max-width:75%;
  line-height:1.7;
  font-size:15px;
  word-wrap:break-word;
}

.user .bubble{
  background:linear-gradient(135deg,#2563eb,#38bdf8);
  color:white;
  border-bottom-right-radius:5px;
  box-shadow:0 8px 20px rgba(37,99,235,0.3);
}

.bot .bubble{
  background:rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  color:white;
  border:1px solid rgba(255,255,255,0.1);
  border-bottom-left-radius:5px;
}

/* INPUT */

.input-area{
  padding:20px;
  background:rgba(255,255,255,0.04);
  border-top:1px solid rgba(255,255,255,0.08);
  display:flex;
  flex-direction:column;
  gap:14px;
}

textarea{
  width:100%;
  min-height:70px;
  resize:none;
  border:none;
  outline:none;
  border-radius:16px;
  padding:15px;
  font-size:15px;
  background:rgba(255,255,255,0.08);
  color:white;
  backdrop-filter: blur(10px);
}

textarea::placeholder{
  color:#cbd5e1;
}

/* FILE INPUT */

input[type="file"]{
  background:rgba(255,255,255,0.06);
  padding:10px;
  border-radius:12px;
  color:white;
  border:1px solid rgba(255,255,255,0.1);
}

/* BUTTON */

button{
  height:50px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#2563eb,#38bdf8);
  color:white;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 8px 20px rgba(37,99,235,0.3);
}

button:hover{
  transform:translateY(-2px);
  opacity:0.95;
}

button:disabled{
  opacity:0.6;
  cursor:not-allowed;
}

/* SCROLLBAR */

::-webkit-scrollbar{
  width:8px;
}

::-webkit-scrollbar-thumb{
  background:#475569;
  border-radius:10px;
}

/* ANIMATION */

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* MOBILE */

@media(max-width:768px){

  .sidebar{
    display:none;
  }

  .bubble{
    max-width:90%;
  }

  .header{
    font-size:20px;
  }

} </style>

</head>
<body>

  <div class="app">

    <div class="sidebar">

  <h3>History Chat</h3>

  <div id="history-list"></div>

</div>

<div class="container">
    <div class="header">
      Gemini AI Chatbot
    </div>

    <div id="chat-box"></div>

    <div class="input-area">

      <textarea
        id="prompt"
        placeholder="Tulis pesan..."
      ></textarea>

      <input type="file" id="document">

      <input type="file" id="image" accept="image/*">

      <button onclick="sendMessage()">
        Kirim
      </button>

    </div>

  </div>

  <script>

    const promptInput = document.getElementById('prompt')

    promptInput.addEventListener('keydown', function(e){

      if(e.key === 'Enter' && !e.shiftKey){

        e.preventDefault()

        sendMessage()

      }

    })

    async function sendMessage(){

           
        const prompt = promptInput.value.trim()

        const button = document.querySelector('button')

button.disabled = true

button.innerText = 'Loading...'

      if(!prompt) return

      const chatBox = document.getElementById('chat-box')

      const fileInput = document.getElementById('document')

      const imageInput = document.getElementById('image')

      chatBox.innerHTML += `
        <div class="message user">
          <div class="bubble">
            ${prompt}
          </div>
        </div>
      `

      promptInput.value = ''

      chatBox.scrollTop = chatBox.scrollHeight

      chatBox.innerHTML += `
        <div class="message bot" id="loading">
          <div class="bubble">
           ⏳ Gemini sedang mengetik...
          </div>
        </div>
      `

      chatBox.scrollTop = chatBox.scrollHeight
      button.disabled = false
      button.innerText = 'Kirim'

      try{

        let response

        // DOCUMENT
        if(fileInput.files.length > 0){

          const formData = new FormData()

          formData.append('document', fileInput.files[0])

          formData.append('prompt', prompt)

          response = await fetch('/generate-from-document', {

            method:'POST',

            body: formData

          })

        }

        // IMAGE
        else if(imageInput.files.length > 0){

          const formData = new FormData()

          formData.append('image', imageInput.files[0])

          formData.append('prompt', prompt)

          response = await fetch('/generate-from-image', {

            method:'POST',

            body: formData

          })

        }

        // TEXT
        else{

          response = await fetch('/generate-text', {

            method:'POST',

            headers:{
              'Content-Type':'application/json'
            },

            body: JSON.stringify({
              prompt: prompt
            })

          })

        }

        const data = await response.json()

        document.getElementById('loading').remove()

        chatBox.innerHTML += `
          <div class="message bot">
            <div class="bubble">
              ${data.result}
            </div>
          </div>
        `

      }catch(error){

        document.getElementById('loading').remove()

        chatBox.innerHTML += `
          <div class="message bot">
            <div class="bubble">
              Quota Gemini habis sementara.
Tunggu beberapa saat lalu coba lagi.
            </div>
          </div>
        `

      }

      fileInput.value = ''
      imageInput.value = ''

      chatBox.scrollTop = chatBox.scrollHeight

    }

    async function loadHistory(){

  const response = await fetch('/chat-history')

  const chats = await response.json()

  const historyList = document.getElementById('history-list')

  historyList.innerHTML = ''

  chats.forEach((chat, index) => {

   historyList.innerHTML += `

  <div
    class="history-item"
    onclick="openChat('${chat._id}')"
  >

    Chat ${index + 1}

  </div>

`

  })

}

loadHistory()

async function openChat(chatId){

  const response = await fetch(`/chat/${chatId}`)

  const chat = await response.json()

  const chatBox = document.getElementById('chat-box')

  chatBox.innerHTML = ''

  chat.messages.forEach((message) => {

    const roleClass =
      message.role === 'user'
      ? 'user'
      : 'bot'

    chatBox.innerHTML += `

      <div class="message ${roleClass}">

        <div class="bubble">

          ${message.text}

        </div>

      </div>

    `

  })

}

  </script>
</div>
</body>
</html>
